    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+Thai:wght@100..900&display=swap');
        body {
            font-family: 'Noto Sans Thai', 'Inter', sans-serif;
            background-color: #0d1117;
            color: #e5e7eb;
        }
        .card {
            background-color: #161b22;

        .table-header {
            background-color: #21262d;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #485058;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #21262d;
        }
        .main-container {
            max-width: 1600px;

            margin-right: auto;
        }
        .chart-canvas-container {
            flex-grow: 1;
            min-height: 0; 
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
        }
        .metric-card-stat {
            font-size: 2rem; 
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.01em;
        }
        .metric-label-prominent {
            font-size: 0.9rem;
            font-weight: 700;
            color: #9ca3af;
            margin-bottom: 0.25rem;
            white-space: normal;
            line-height: 1.2;
            word-break: break-word;
        }
        .card-title {
            font-size: 1.1rem; 
            font-weight: 800;
            color: #d1d5db;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .custom-legend-text {
            font-size: 0.95rem; 
            font-weight: 600;
        }
        .compact-table {
            table-layout: auto; 
            width: 100%;
            border-collapse: collapse;

        .compact-table th {
            padding: 6px 4px !important;
            font-size: 10px !important;

            text-align: left;

        .compact-table td {

            line-height: 1.2;

    <script>
        // --- Configuration ---
        const SPREADSHEET_ID = '1CpopbKf2xyQZKGsQsME6j7WDzhXD2Ne6KKR4srlXSS4'; 
        const USERS_GID = '0'; 
        const ARCHIVE_GID = '1646451491'; 
        const TRANSACTIONS_GID = '1700626445';
        const DAILY_STATS_GID = '1269483294';

        const USERS_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${USERS_GID}`;
        const ARCHIVE_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${ARCHIVE_GID}`;
        const TRANSACTIONS_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${TRANSACTIONS_GID}`;
        const DAILY_STATS_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${DAILY_STATS_GID}`;

        const COLOR_SETS = {
            status: ['#10B981', '#F43F5E', '#9CA3AF'],
            method: ['#8B5CF6', '#EC4899', '#6366F1'],
            package: ['#FBBF24', '#F97316'],
            source: ['#3B82F6', '#10B981', '#F43F5E', '#06B6D4', '#6366F1'],
            metrics: { 
                blue: '#3B82F6', emerald: '#10B981', amber: '#F59E0B', 
                indigo: '#6366F1', yellow: '#FBBF24', purple: '#A855F7', 
                rose: '#F43F5E', orange: '#F97316' 
            }
        };

        // --- Utility Functions ---

        function getColumnKey(obj, possibleKeys) {
            if (!obj) return null;
            const keys = Object.keys(obj);
            for (const target of possibleKeys) {
                const cleanTarget = target.toLowerCase().replace(/\s/g, '');
                const found = keys.find(k => k.toLowerCase().replace(/\s/g, '') === cleanTarget);
                if (found) return found;
            }
            return null;
        }

        function getCleanVal(item, keyName, altKeys = []) {
            const keys = [keyName, ...altKeys];
            const key = getColumnKey(item, keys);
            if (!key) return '';
            return (item[key] || '').toString().trim().toLowerCase().replace(/\s/g, '');
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                 let year = parseInt(parts[2]);
                 if (year > 2400) year -= 543;
                 return new Date(year, parts[1] - 1, parts[0]);
            }
            return null;
        }

        function parseCSV(csvString, sourceFile) {
            const lines = csvString.trim().split('\n').filter(l => l.trim().length > 0);
            if (lines.length <= 1) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(',');
                const obj = {};
                headers.forEach((h, i) => obj[h] = (values[i] || '').trim());
                obj.source_file = sourceFile;
                return obj;
            });
        }

        async function fetchData(url, source) {
            try {
                const res = await fetch(url);
                if (!res.ok) return [];
                return parseCSV(await res.text(), source);
            } catch { return []; }
        }

        // --- Logic Calculation Function ---
        function calculateStats(allMembers, usersOnly, transactions) {
            const today = new Date(); today.setHours(0,0,0,0);
            const thirtyDaysAgo = new Date(today.getTime() - (30 * 24 * 60 * 60 * 1000));
            
            const qrIDs = new Set();
            const transLatestExp = new Map();

            transactions.forEach(t => {
                const uidKey = Object.keys(t)[0];
                const uid = t[uidKey]?.toString().trim().toLowerCase();
                if(!uid) return;
                qrIDs.add(uid);
                
                const expDate = parseDate(getCleanVal(t, 'Expiry Date', ['ExpDate']));
                if(expDate && (!transLatestExp.has(uid) || expDate > transLatestExp.get(uid))) {
                    transLatestExp.set(uid, expDate);
                }
            });

            const ofIDs = new Set();
            const stripeIDs = new Set();
            const mainStatus = new Map();
            
            allMembers.forEach(m => {
                const uid = getCleanVal(m, 'User ID', ['uid']);
                if(!uid) return;
                const s = getCleanVal(m, 'Member Status', ['Status']);
                const met = getCleanVal(m, 'Method', ['Payment Method']);
                
                mainStatus.set(uid, s);
                if (['active', 'reactive', 'expired'].includes(s)) {
                    if (met === 'onlyfans') ofIDs.add(uid);
                    else if (met === 'stripe') stripeIDs.add(uid);
                }
            });

            const paidIDs = new Set([...qrIDs, ...ofIDs, ...stripeIDs]);
            const activeIDs = new Set();
            const expiredIDs = new Set();

            paidIDs.forEach(uid => {
                const s = mainStatus.get(uid);
                const expDate = transLatestExp.get(uid);
                if (['active', 'reactive'].includes(s) || (expDate && expDate >= today)) activeIDs.add(uid);
                else expiredIDs.add(uid);
            });

            const nonMemberIDs = new Set();
            allMembers.forEach(m => {
                const uid = getCleanVal(m, 'User ID', ['uid']);
                const s = getCleanVal(m, 'Member Status', ['Status']);
                if(uid && ['start', 'restart'].includes(s) && !paidIDs.has(uid)) nonMemberIDs.add(uid);
            });

            // --- REVENUE CALCULATION WITH USD CONVERSION ---
            const USD_EXCHANGE_RATE = 33; 
            const totalRev = transactions.reduce((sum, t) => {
                const amountKey = getColumnKey(t, ['Amount', 'Price', 'Value']);
                let rawStr = (t[amountKey] || '0').toString().replace(/[,\s฿]/g, '');
                let val = parseFloat(rawStr) || 0;

                // ถ้ามียอดเป็น 7.99 ให้คูณเรท 33 บาททันที
                if (Math.abs(val - 7.99) < 0.01) {
                    val = val * USD_EXCHANGE_RATE;
                }

                return sum + val;
            }, 0);

            const transUniqueIDs = new Set();
            transactions.forEach(t => {
                const uid = Object.values(t)[0]?.toString().trim().toLowerCase();
                if(uid) transUniqueIDs.add(uid);
            });
            const transCount = transUniqueIDs.size;
            const arpuVal = transCount > 0 ? (totalRev / transCount) : 0;
            
            const totalDurationDays = transactions.reduce((sum, t) => {
                const start = parseDate(getCleanVal(t, 'Start Date', ['StartDate']));
                const end = parseDate(getCleanVal(t, 'Expiry Date', ['ExpDate', 'EndDate']));
                if (start && end) {
                    const diffDays = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)); 
                    return sum + diffDays;
                }
                return sum;
            }, 0);

            const avgDuration = transCount > 0 ? (totalDurationDays / transCount) : 0;
            const ltvVal = arpuVal * (avgDuration / 30.4375);

            const expiredIn30DaysSet = new Set();
            transactions.forEach(t => {
                const uid = Object.values(t)[0]?.toString().trim().toLowerCase();
                const expDate = parseDate(getCleanVal(t, 'Expiry Date', ['ExpDate']));
                if (uid && expDate && expDate >= thirtyDaysAgo && expDate < today) expiredIn30DaysSet.add(uid);
            });
            const retentionDenominator = expiredIn30DaysSet.size;

            let renewedCount = 0;
            if (retentionDenominator > 0) {
                const renewedSet = new Set();
                transactions.forEach(t => {
                    const uid = Object.values(t)[0]?.toString().trim().toLowerCase();
                    const startDate = parseDate(getCleanVal(t, 'Start Date', ['StartDate']));
                    if (uid && startDate && startDate >= thirtyDaysAgo && startDate <= today) {
                        if (expiredIn30DaysSet.has(uid)) renewedSet.add(uid);
                    }
                });
                renewedCount = renewedSet.size;
            }
            const retentionRate = retentionDenominator > 0 ? (renewedCount / retentionDenominator) * 100 : 0;

            return {
                metrics: { activeCount: activeIDs.size, totalRev, arpuVal, ltvVal, avgDuration, retentionRate },
                statusData: { 'Active': activeIDs.size, 'Expired': expiredIDs.size, 'Non-member': nonMemberIDs.size },
                methodData: { 'QR': qrIDs.size, 'OnlyFans': ofIDs.size, 'Stripe': stripeIDs.size }
            };
        }

        // --- Rendering ---
        
        function renderMetrics(metrics) {
             const formatCard = (val, label, color, icon, suffix = '', isCur = false) => {
                let disp = val.toLocaleString();
                if (isCur) disp = val.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0});
                if (label.includes('อัตราการรักษา')) disp = val.toFixed(1); 
                else if (label.includes('ระยะเวลา')) disp = Math.round(val);
                else if (label.includes('มูลค่า') || label.includes('เฉลี่ย')) disp = Math.round(val).toLocaleString();

                return `
                    <div class="card p-3 rounded-xl border-l-4 flex justify-between items-center" style="border-left-color: ${color}">
                        <div class="flex flex-col pr-1 overflow-hidden w-full">
                            <span class="metric-label-prominent text-gray-400 truncate mb-1" title="${label}">${label}</span>
                            <div class="flex justify-between items-center w-full">
                                <i data-lucide="${icon}" style="color: ${color}; width: 28px; height: 28px;"></i>
                                <span class="metric-card-stat text-white whitespace-nowrap">${disp}${suffix}</span>
                            </div>
                        </div>
                    </div>`;
            };

            document.getElementById('metrics-cards').innerHTML = 
                formatCard(metrics.activeCount, 'สมาชิกปัจจุบัน', COLOR_SETS.metrics.emerald, 'user-check') +
                formatCard(metrics.totalRev, 'รายได้รวม', COLOR_SETS.metrics.yellow, 'banknote', ' ฿', true) +
                formatCard(metrics.arpuVal, 'รายได้เฉลี่ยต่อคน', COLOR_SETS.metrics.indigo, 'trending-up', ' ฿', true) +
                formatCard(metrics.ltvVal, 'มูลค่าลูกค้าตลอดชีพ', COLOR_SETS.metrics.purple, 'gem', ' ฿', true) +
                formatCard(metrics.avgDuration, 'ระยะเวลาสมาชิกเฉลี่ย', COLOR_SETS.metrics.blue, 'calendar-clock', ' วัน') +
                formatCard(metrics.retentionRate, 'อัตราการรักษาลูกค้า', COLOR_SETS.metrics.rose, 'refresh-ccw', '%');
            
            lucide.createIcons();
        }

        function renderStackedBar(id, labels, values, colorScheme) {
            const chart = Chart.getChart(id);
            if (chart) chart.destroy();
            const ctx = document.getElementById(id).getContext('2d');
            const total = values.reduce((a, b) => a + b, 0);
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [''],
                    datasets: labels.map((l, i) => ({
                        label: l, data: [values[i]], backgroundColor: colorScheme[i % colorScheme.length],
                        borderRadius: i === 0 ? {topLeft: 6, bottomLeft: 6} : i === labels.length - 1 ? {topRight: 6, bottomRight: 6} : 0,
                        borderSkipped: false, barThickness: 28
                    }))
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    scales: { x: { stacked: true, display: false, max: total || 1 }, y: { stacked: true, display: false } },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.raw} คน` } } }
                }
            });
            const leg = document.getElementById(id + '-legend');
            leg.innerHTML = labels.map((l, i) => `
                <div class="inline-flex items-center mx-2">
                    <span class="w-3 h-3 rounded-full mr-2" style="background-color: ${colorScheme[i % colorScheme.length]}"></span>
                    <span class="text-gray-300 mr-1">${l}:</span>
                    <span class="text-white font-bold">${values[i]}</span>
                    <span class="text-gray-500 text-xs ml-1">(${total > 0 ? (values[i]/total*100).toFixed(1) : 0}%)</span>
                </div>`).join('');
        }

        function renderLine(id, chartData) {
            const chart = Chart.getChart(id);
            if (chart) chart.destroy();
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        data: chartData.data,
                        borderColor: function(context) {
                            const {ctx, chartArea} = context.chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(chartArea.left, 0, chartArea.right, 0);
                            gradient.addColorStop(0, '#ff4d4d'); gradient.addColorStop(0.2, '#ffa64d');
                            gradient.addColorStop(0.4, '#ffff4d'); gradient.addColorStop(0.6, '#4dff4d');
                            gradient.addColorStop(0.8, '#4d4dff'); gradient.addColorStop(1, '#a64dff');
                            return gradient;
                        },
                        backgroundColor: 'rgba(255, 255, 255, 0.03)',
                        borderWidth: 5, fill: true, tension: 0.4, pointRadius: 0, pointHoverRadius: 8, pointHoverBackgroundColor: '#fff', pointHoverBorderWidth: 3
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, bodyFont: { size: 14 }, titleFont: { size: 14 }, callbacks: { title: (items) => items[0].label, label: (item) => `จำนวน: ${item.parsed.y.toLocaleString()} คน` } } },
                    scales: { x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#9ca3af', font: { size: 11 }, maxRotation: 0 } }, y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#9ca3af', font: { size: 11 }, precision: 0 } } }
                }
            });
        }

        function renderTable(data) {
            if (data.length === 0) return;
            const headers = Object.keys(data[0]).filter(h => h !== 'source_file');
            const colClasses = ['w-col-id', 'w-col-user', 'w-col-status', 'w-col-action', 'w-col-exp', 'w-col-method', 'w-col-ref', 'w-col-source', 'w-col-update', 'w-col-join', 'w-col-lang'];
            document.getElementById('table-header-row').innerHTML = headers.map((h, i) => `<th class="${colClasses[i]||''}">${h}</th>`).join('');
            document.getElementById('tableBody').innerHTML = data.map(row => {
                const status = getCleanVal(row, 'Member Status', ['Status']);
                const color = (status === 'active' || status === 'reactive') ? 'text-emerald-400' : status === 'expired' ? 'text-rose-400' : 'text-gray-400';
                return `<tr class="hover:bg-gray-800/40 transition-colors">
                    ${headers.map((h, i) => {
                        let val = row[h] || '-';
                        if (colClasses[i] === 'w-col-ref' && val.toString().startsWith('http')) {
                            val = `<a href="${val}" target="_blank" class="text-blue-400 hover:text-blue-300 transition-colors underline">Link</a>`;
                        }
                        return `<td class="${colClasses[i]||''} ${h==='Member Status'?color+' font-bold':''}" title="${row[h]}">${val}</td>`;
                    }).join('')}
                </tr>`;
            }).join('');
        }

        function adjustLayout() {
            if (window.innerWidth < 1024) {
                document.getElementById('main-content-grid').style.height = '';
                document.getElementById('line-chart-card').style.height = '';
                document.getElementById('joinDateChart-container').style.height = ''; 
                document.getElementById('table-card').style.height = '';
                document.getElementById('table-container').style.height = '';
                return;
            }
            const headH = document.getElementById('dashboard-header').offsetHeight;
            const metH = document.getElementById('metrics-cards').offsetHeight;
            const bodyH = window.innerHeight;
            const totalContentH = bodyH - headH - metH - 45; 
            const grid = document.getElementById('main-content-grid');
            grid.style.height = totalContentH + 'px';
            const splitH = totalContentH / 2;
            const gap = 6;
            document.getElementById('line-chart-card').style.height = (splitH - gap) + 'px';
            document.getElementById('joinDateChart-container').style.height = (splitH - gap - 50) + 'px';
            document.getElementById('table-card').style.height = (splitH - gap) + 'px';
            document.getElementById('table-container').style.height = (splitH - gap - 50) + 'px';
        }

        async function initDashboard() {
            const statusEl = document.getElementById('data-status');
            statusEl.innerText = '⏳ กำลังซิงค์ข้อมูล...';
            const [users, archive, trans, dailyStats] = await Promise.all([
                fetchData(USERS_URL, 'Users'), fetchData(ARCHIVE_URL, 'Archive'),
                fetchData(TRANSACTIONS_URL, 'Transactions'), fetchData(DAILY_STATS_URL, 'DailyStats')
            ]);
            const combined = [...users, ...archive];
            if (combined.length === 0) { statusEl.innerText = '❌ เชื่อมต่อไม่ได้'; return; }
            statusEl.innerHTML = `✅ Last update: <span class="font-semibold text-emerald-400">${new Date().toLocaleString('th-TH')}</span>`;
            
            const stats = calculateStats(combined, users, trans);
            renderMetrics(stats.metrics);

            renderStackedBar('statusChart', ['Active', 'Expired', 'Non-member'], 
                [stats.statusData['Active'], stats.statusData['Expired'], stats.statusData['Non-member']], COLOR_SETS.status);

            renderStackedBar('methodChart', ['QR', 'OnlyFans', 'Stripe'], 
                [stats.methodData['QR'], stats.methodData['OnlyFans'], stats.methodData['Stripe']], COLOR_SETS.method);

            const pData = aggregateRobust(trans, 'Package', [], ['1 Month', '3 Months']);
            renderStackedBar('packageChart', Object.keys(pData), Object.values(pData), COLOR_SETS.package);
            
            const srcKey = getColumnKey(combined[0], ['Source']);
            const srcCounts = {}; 
            combined.forEach(m => { 
                const s = m[srcKey]?.toLowerCase() || 'ไม่ระบุ'; 
                if (s !== '-') srcCounts[s] = (srcCounts[s] || 0) + 1; 
            });
            renderStackedBar('sourceChart', Object.keys(srcCounts), Object.values(srcCounts), COLOR_SETS.source);

            let cL = [], cV = [];
            if (dailyStats.length > 0) {
                 const dK = Object.keys(dailyStats[0])[0], cK = Object.keys(dailyStats[0])[3];
                 dailyStats.forEach(r => { if(r[dK] && r[cK]) { cL.push(r[dK]); cV.push(parseInt(r[cK].replace(/,/g,'')) || 0); }});
            } else {
                const jK = getColumnKey(combined[0], ['Join Date']), dM = {};
                combined.forEach(i => { const d = i[jK]; if (d) { const p = d.split('/'); if (p.length === 3) { const iso = `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`; dM[iso] = (dM[iso] || 0) + 1; }}});
                const srt = Object.keys(dM).sort(); cL = srt.map(i => i.split('-').reverse().join('/')); cV = srt.map(i => dM[i]);
            }
            renderLine('joinDateChart', { labels: cL, data: cV });

            renderTable(users);
            setTimeout(adjustLayout, 150);
        }

        function aggregateRobust(data, mainKey, altKeys, allowedValues) {
            const counts = {};
            allowedValues.forEach(v => counts[v] = 0);
            data.forEach(item => {
                const rawVal = getCleanVal(item, mainKey, altKeys);
                allowedValues.forEach(allowed => {
                    const cleanAllowed = allowed.toLowerCase().replace(/\s/g, '');
                    if (rawVal === cleanAllowed || rawVal.includes(cleanAllowed)) {
                        counts[allowed]++;
                    }
                });
            });
            return counts;
        }

        window.onload = initDashboard;
        window.onresize = adjustLayout;
        lucide.createIcons();
    </script>
</body>
</html>
